<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="nexus-service" content="master-web"/>
  <title>Login — {{ brand_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>{{ master_css()|safe }}</style>
</head>
<body class="login-page">
  <div class="login-backdrop" style="background-image:url('{{ static_url("master/images/login/hero-bg.png") }}')"></div>
  <div class="login-overlay" aria-hidden="true"></div>

  <main class="login-stage">
    <div class="login-panel">
      <h1 class="login-panel-title">Login</h1>
      <p class="login-panel-brand">{{ brand_name }}</p>

      {% if error %}<div class="login-alert">{{ error }}</div>{% endif %}

      <form method="post" action="/login" class="login-form">
        <div class="login-field">
          <label for="email">E-mail</label>
          <input id="email" name="email" type="text" required autocomplete="username" placeholder="Digite seu e-mail" value="{{ email }}"/>
        </div>

        <div class="login-field">
          <label for="password">Senha</label>
          <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Digite sua senha"/>
        </div>

        <div class="login-field">
          <label for="captcha">Código de segurança</label>
          <div class="login-captcha-row">
            <div class="login-captcha-code" id="captcha-display">{{ captcha_code }}</div>
            <button type="button" class="login-captcha-refresh" id="captcha-refresh" title="Gerar novo código" aria-label="Gerar novo código">↻</button>
          </div>
          <input id="captcha" name="captcha" type="text" required autocomplete="off" placeholder="Digite o código acima" maxlength="6"/>
        </div>

        <div class="login-forgot">
          <a href="#" onclick="return false;">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="login-submit">Enviar</button>
      </form>

      <div class="login-security">
        <p>Nunca compartilhe sua senha. Verifique o código antes de entrar.</p>
      </div>
    </div>

    <p class="login-foot">© 2026 {{ brand_name }} · Build {{ app_build }}</p>
  </main>

  <script>
  (function () {
    var display = document.getElementById("captcha-display");
    var refresh = document.getElementById("captcha-refresh");
    var input = document.getElementById("captcha");
    if (!display || !refresh) return;

    function randomCode() {
      var chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789";
      var out = "";
      for (var i = 0; i < 6; i++) out += chars.charAt(Math.floor(Math.random() * chars.length));
      return out;
    }

    refresh.addEventListener("click", function () {
      fetch("/login/captcha", { credentials: "same-origin" })
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (!data || !data.code) return;
          display.textContent = data.code;
          if (input) input.value = "";
        })
        .catch(function () {
          display.textContent = randomCode();
        });
    });
  })();
  </script>
</body>
</html>
